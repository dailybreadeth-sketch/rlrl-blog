<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="3jo8xjttu90R9LjVmIRP__N-E2oeDeJFAuK-g7EkWr8" />
    <title>{{ page.title }} | {{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css">
    {% if page.layout == "post" %}
    <!-- Include JSON-LD dynamically for search engines -->
    {% endif %}
</head>
<body>
    <div class="wrapper">
        <!-- Sidebar (Chirpy theme styled) -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="{{ site.baseurl }}/" class="brand-title">Head Skinification Lab</a>
                <p class="brand-desc">{{ site.description }}</p>
            </div>
            <nav class="nav-menu">
                <a href="{{ site.baseurl }}/" class="nav-link">🏠 Home</a>
            </nav>
            <div class="sidebar-footer">
                <p>Head Skinification Curation Lab</p>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            {{ content }}
        </main>

        <!-- Right Panel (Search & Dark Mode) -->
        <aside class="right-panel">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="🔍 실시간 포스팅 검색..." onkeyup="searchPosts()">
                <div id="search-results" class="search-results-list"></div>
            </div>
            
            <div class="theme-toggle-wrapper">
                <span class="theme-label">🌓 테마 변경</span>
                <label class="switch">
                    <input type="checkbox" id="theme-checkbox" onclick="toggleTheme()">
                    <span class="slider round"></span>
                </label>
            </div>
        </aside>
    </div>

    <script src="{{ site.baseurl }}/assets/js/main.js"></script>
    <script>
        // Simple client-side search data feeding
        const postsData = [
            {% for post in site.posts %}
            {
                "title": "{{ post.title }}",
                "url": "{{ site.baseurl }}{{ post.url }}",
                "desc": "{{ post.description }}"
            }{% unless forloop.last %},{% endunless %}
            {% endfor %}
        ];
    </script>
</body>
</html>
