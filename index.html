---
layout: default
title: Home
---

<div class="home-container">
    <h2 class="section-title">최신 포스팅 목록</h2>
    
    <div class="posts-list">
        {% for post in site.posts %}
        {% assign post_cat = post.categories | first %}
        <article class="post-card" data-category="{{ post_cat | slugify }}">
            <header class="card-header">
                <div class="card-meta-row">
                    <span class="card-date">{{ post.date | date: "%Y-%m-%d" }}</span>
                    {% if post_cat %}
                    <span class="card-badge">{{ post_cat }}</span>
                    {% endif %}
                </div>
                <h3 class="card-title">
                    <a href="{{ site.baseurl }}{{ post.url }}">{{ post.title }}</a>
                </h3>
            </header>
            <section class="card-body">
                <p>{{ post.description }}</p>
            </section>
            <footer class="card-footer">
                <a href="{{ site.baseurl }}{{ post.url }}" class="read-more">자세히 읽기 &rarr;</a>
            </footer>
        </article>
        {% else %}
        <p class="no-posts">등록된 포스팅이 없습니다.</p>
        {% endfor %}
    </div>
</div>
